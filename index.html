html[data-fs="s"]{font-size:14px}
html[data-fs="l"]{font-size:18px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:var(--f-display);color:var(--ink);line-height:1.2;letter-spacing:-.01em;margin:0 0 .4em}
h1{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:700}
h2{font-size:clamp(1.15rem,2vw,1.5rem);font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0 0 .8rem}
a{color:var(--navy-2);text-decoration:none}
a:hover{text-decoration:underline}
ul{margin:0;padding:0;list-style:none}
button{font-family:inherit}
img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 1rem}
.mono{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.dim{color:var(--dim)}
.hide{display:none!important}

/* ---------- top utility strip ---------- */
.strip{background:var(--navy);color:#cfe0f0;font-size:.78rem}
.strip-in{max-width:var(--maxw);margin:0 auto;padding:.4rem 1rem;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.6rem}
.strip-left{min-width:0}
.strip-center{display:flex;flex-direction:column;align-items:center;gap:.18rem;text-align:center}
.strip-right{justify-self:end;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.loc-pill{display:inline-flex;align-items:center;gap:.35rem;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.09);color:#eaf2f9;border-radius:999px;padding:.18rem .7rem;font-size:.76rem;cursor:pointer;font-family:inherit;line-height:1.5}
.loc-pill:hover{background:rgba(255,255,255,.18)}
.loc-pill b{font-weight:600;color:#fff}
.strip-sub{display:flex;gap:.45rem;align-items:center;font-size:.72rem}
.strip-sub .sep{opacity:.45}
@media (max-width:700px){
  .strip-in{grid-template-columns:1fr;justify-items:center;gap:.3rem}
  .strip-left{display:none}
  .strip-right{justify-self:center}
}
.strip a{color:#cfe0f0;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.strip a:hover{color:#fff;text-decoration:underline}

.strip select{background:transparent;border:1px solid rgba(255,255,255,.28);color:#eaf2f9;border-radius:6px;font-size:.75rem;padding:.15rem .3rem;max-width:180px}
.strip select option{color:#0d1b2a}

/* ---------- header ---------- */
.header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow-1)}
.header-in{max-width:var(--maxw);margin:0 auto;padding:.65rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.55rem;flex:0 0 auto}
.logo-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;box-shadow:var(--shadow-1);flex:0 0 auto}
.logo-mark svg{width:100%;height:100%;display:block;border-radius:12px}
.logo-txt{display:flex;flex-direction:column;line-height:1}
.logo-hi{font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--ink);letter-spacing:-.02em}
.logo-en{font-family:var(--f-mono);font-size:.55rem;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.search{flex:1 1 320px;display:flex;align-items:center;gap:.5rem;background:var(--card-2);border:1px solid var(--border-2);border-radius:10px;padding:.3rem .3rem .3rem .75rem;min-width:0}
.search input{flex:1;border:0;background:transparent;font-family:var(--f-body);font-size:.9rem;color:var(--text);padding:.4rem 0;min-width:0}
.search input:focus{outline:none}
.search button{border:0;background:var(--navy);color:#fff;border-radius:8px;padding:.45rem .8rem;cursor:pointer;display:flex;align-items:center;gap:.35rem;font-size:.82rem;font-weight:500}
.search button:hover{background:var(--navy-2)}
.h-actions{display:flex;align-items:center;gap:.5rem;margin-left:auto}
.hbtn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--border-2);background:var(--card);color:var(--ink);border-radius:9px;padding:.5rem .75rem;font-size:.85rem;font-weight:500;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:var(--card-2);text-decoration:none}
.hbtn.amber{background:var(--amber);border-color:var(--amber);color:#3a2200;font-weight:600}
.hbtn.amber:hover{background:var(--amber-2)}
.hbtn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.hbtn.navy:hover{background:var(--navy-2)}

.avatar-sm{width:22px;height:22px;border-radius:50%;background:var(--amber);color:#3a2200;display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.72rem}
.upi-apps{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}
.qrbox{display:inline-flex;flex-direction:column;align-items:center;gap:.25rem;border:1px solid var(--border);border-radius:10px;padding:.5rem;background:var(--card)}
.qrbox img{width:150px;height:150px;object-fit:contain}
.qrbox small{font-size:.66rem;color:var(--dim);font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
select.langsel{max-width:120px;font-family:var(--f-body);font-size:.8rem;color:var(--ink);background:var(--card);border:1px solid var(--border-2);border-radius:9px;padding:.5rem .35rem;cursor:pointer}
select.shopsel{max-width:200px;font-family:var(--f-body);font-size:.8rem;color:var(--ink);background:var(--card);border:1px solid var(--border-2);border-radius:9px;padding:.5rem .4rem;cursor:pointer}
@media (max-width:880px){select.shopsel{max-width:120px;font-size:.74rem}}
.cartbtn{position:relative}
.count{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.6rem;padding:0 4px;border:2px solid var(--card)}
@media (max-width:880px){
  .header-in{padding:.5rem .7rem;gap:.5rem}
  .logo-en{display:none}
  .logo-hi{font-size:1.1rem}
  .search{order:3;flex-basis:100%}
  .hbtn .lbl{display:none}
  .hbtn{padding:.5rem .55rem}
}

/* ---------- category bar ---------- */
.catbar{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:60px;z-index:40}
.catbar-in{max-width:var(--maxw);margin:0 auto;padding:.4rem 1rem;display:flex;gap:.3rem;overflow-x:auto;scrollbar-width:none}
.catbar-in::-webkit-scrollbar{display:none}
.catbar a{padding:.4rem .7rem;font-size:.84rem;color:var(--text);border-radius:7px;white-space:nowrap}
.catbar a:hover{background:var(--card-2);text-decoration:none;color:var(--ink)}
.catbar a.on{color:var(--amber-2);font-weight:600;background:var(--amber-soft)}

/* ---------- common ---------- */
.sec{padding:1.6rem 0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.sec-head h2{margin:0;display:flex;align-items:center;gap:.5rem}
.sec-head h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--amber)}
.sec-head .more{font-size:.82rem;color:var(--navy-2);font-weight:500}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1);min-width:0}
.pad{padding:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid transparent;border-radius:9px;padding:.55rem 1rem;font-size:.86rem;font-weight:600;cursor:pointer;background:var(--card);color:var(--ink);transition:background .15s,border-color .15s,transform .15s;text-decoration:none}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn-primary{background:var(--amber);color:#3a2200}
.btn-primary:hover{background:var(--amber-2);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-2);color:#fff}
.btn-ghost{border-color:var(--border-2);background:var(--card)}
.btn-ghost:hover{background:var(--card-2)}
.btn-sm{padding:.35rem .65rem;font-size:.78rem;border-radius:7px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.tag{display:inline-flex;align-items:center;gap:.28rem;font-size:.7rem;padding:.12rem .45rem;border-radius:5px;background:var(--card-2);border:1px solid var(--border);color:var(--dim);white-space:nowrap}
.tag.g{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.tag.a{background:var(--amber-soft);color:var(--amber-2);border-color:transparent}
.tag.r{background:var(--red-soft);color:var(--red);border-color:transparent}
.tag.b{background:var(--blue-soft);color:var(--navy-2);border-color:transparent}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:.8rem}
.g-prod{grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:.6rem}
@media(min-width:760px){.g-prod{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.8rem}}
@media(min-width:1200px){.g-prod{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.pcard{max-width:100%}
.pcard .pname{font-size:.82rem;line-height:1.25}
@media(max-width:759px){.pcard .pname{font-size:.76rem}.pcard .pprice b{font-size:.95rem}}
.g-shop{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--dim)}
.empty .big{font-size:2rem;display:block;margin-bottom:.4rem}
.crumbs{display:flex;gap:.35rem;align-items:center;font-size:.78rem;color:var(--dim);padding:.8rem 0 0;flex-wrap:wrap}
.crumbs a{color:var(--dim)}

/* ---------- banner ---------- */
.banner{background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 55%,#1e5c8a 100%);border-radius:var(--r-lg);color:#fff;padding:clamp(1.2rem,3vw,2.2rem);display:grid;grid-template-columns:1.25fr .75fr;gap:1.2rem;align-items:center;position:relative;overflow:hidden;box-shadow:var(--shadow-2)}
.banner::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(245,158,11,.18)}
.banner::before{content:"";position:absolute;left:-40px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.banner h1{color:#fff;margin-bottom:.4rem;font-size:clamp(1.5rem,3.2vw,2.4rem)}
.banner h1 em{font-style:normal;color:var(--amber)}
.banner p{color:#cfe0f0;margin-bottom:1rem;max-width:46ch}
.banner .pills{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.banner .pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#eaf2f9;font-size:.74rem;padding:.2rem .55rem;border-radius:999px}
.banner-side{position:relative;z-index:1;display:grid;gap:.5rem}
.bstat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:.6rem .8rem;backdrop-filter:blur(4px)}
.bstat b{display:block;font-family:var(--f-display);font-size:1.2rem;color:#fff}
.bstat small{color:#cfe0f0;font-size:.72rem}
@media (max-width:780px){.banner{grid-template-columns:1fr}.banner-side{grid-template-columns:1fr 1fr;display:grid}}

/* ---------- category circles ---------- */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:.5rem}
.cat{display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:.7rem .3rem;border-radius:var(--r);background:var(--card);border:1px solid var(--border);color:var(--ink);font-size:.76rem;text-align:center;font-weight:500}
.cat:hover{text-decoration:none;border-color:var(--amber);box-shadow:var(--shadow-2);transform:translateY(-2px);transition:.15s}
.cat .e{font-size:1.5rem}

/* ---------- product card ---------- */
.pcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:box-shadow .16s,transform .16s,border-color .16s}
.pcard:hover{box-shadow:var(--shadow-2);transform:translateY(-2px);border-color:var(--border-2);text-decoration:none}
.pthumb{aspect-ratio:1/1;display:grid;place-items:center;font-size:2.1rem;position:relative;border-bottom:1px solid var(--border);background:linear-gradient(150deg,#fbfcfe,#eef3f9)}
@media (prefers-color-scheme:dark){.pthumb{background:linear-gradient(150deg,#16232f,#101b26)}}
@media(min-width:760px){.pthumb{aspect-ratio:1/.82;font-size:2.4rem}}
.pthumb .disc{position:absolute;top:.45rem;left:.45rem;background:var(--red);color:#fff;font-family:var(--f-mono);font-size:.62rem;padding:.12rem .35rem;border-radius:4px;letter-spacing:.04em}
.pthumb .shops{position:absolute;bottom:.45rem;right:.45rem;background:rgba(255,255,255,.94);color:var(--navy);font-size:.64rem;font-weight:600;padding:.1rem .4rem;border-radius:999px;border:1px solid var(--border)}
.pbody{padding:.6rem .7rem .75rem;display:flex;flex-direction:column;gap:.15rem;flex:1}
.pbrand{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.pname{font-size:.86rem;font-weight:600;color:var(--ink);line-height:1.3;margin:0}
.pprice{display:flex;align-items:baseline;gap:.35rem;margin-top:auto;padding-top:.4rem;flex-wrap:wrap}
.pprice b{font-family:var(--f-display);font-size:1.02rem;color:var(--ink)}
.pprice s{font-size:.74rem;color:var(--dim)}
.pprice .off{font-size:.72rem;color:var(--teal);font-weight:600}
.prate{display:inline-flex;align-items:center;gap:.2rem;font-size:.68rem;color:var(--dim)}
.prate i{background:var(--teal);color:#fff;border-radius:3px;padding:0 .25rem;font-style:normal;font-size:.62rem;font-weight:700}
.addmini{margin-top:.45rem;width:100%;border:1px solid var(--border-2);background:var(--card);color:var(--navy);border-radius:7px;padding:.32rem;font-size:.76rem;font-weight:600;cursor:pointer}
.addmini:hover{background:var(--amber);border-color:var(--amber);color:#3a2200}

/* ---------- shop card ---------- */
.shopcard{display:flex;gap:.75rem;padding:.85rem;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:var(--r);transition:.16s}
.shopcard:hover{box-shadow:var(--shadow-2);transform:translateY(-2px);text-decoration:none;border-color:var(--border-2)}
.slogo{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-size:1.35rem;background:var(--amber-soft);flex:0 0 auto;overflow:hidden;border:1px solid var(--border)}
.slogo img{width:100%;height:100%;object-fit:cover}
.shopcard h3{margin:0 0 .15rem;font-size:.94rem}
.smeta{font-size:.74rem;color:var(--dim);display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.dist{font-family:var(--f-mono);font-size:.68rem;color:var(--teal);background:var(--teal-soft);padding:.05rem .35rem;border-radius:4px}

/* ---------- listing layout ---------- */
.listing{display:grid;grid-template-columns:230px minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:900px){.listing{grid-template-columns:1fr}.filters{position:static!important}}
.filters{position:sticky;top:110px}
.fgroup{padding:.9rem 1rem;border-bottom:1px solid var(--border)}
.fgroup:last-child{border-bottom:0}
.fgroup h4{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:.5rem;font-weight:500}
.fopt{display:flex;align-items:center;gap:.45rem;font-size:.82rem;padding:.22rem 0;cursor:pointer;color:var(--text)}
.fopt input{accent-color:var(--amber)}
.sortbar{display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap;font-size:.82rem}
.sortbar select{font-family:var(--f-body);font-size:.82rem;padding:.4rem .5rem;border:1px solid var(--border-2);border-radius:8px;background:var(--card);color:var(--text)}

/* ---------- product detail ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.4rem;align-items:start}
@media (max-width:880px){.detail{grid-template-columns:1fr}}
.bigthumb{aspect-ratio:1;display:grid;place-items:center;font-size:6rem;background:linear-gradient(150deg,#fbfcfe,#eaf0f7);border:1px solid var(--border);border-radius:var(--r-lg);position:relative}
@media (prefers-color-scheme:dark){.bigthumb{background:linear-gradient(150deg,#16232f,#101b26)}}
.pricebox{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:1rem}
.bigprice{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.bigprice b{font-family:var(--f-display);font-size:1.9rem;color:var(--ink);line-height:1}
.bigprice s{color:var(--dim);font-size:.9rem}
.bigprice .off{color:var(--teal);font-weight:700;font-size:.95rem}
.offer{display:flex;gap:.7rem;align-items:center;padding:.7rem;border:1px solid var(--border);border-radius:10px;background:var(--card);margin-bottom:.5rem;flex-wrap:wrap}
.offer.best{border-color:var(--teal);background:linear-gradient(90deg,var(--teal-soft),transparent 70%)}
.offer-main{flex:1 1 170px;display:flex;gap:.6rem;align-items:center;min-width:0}
.offer-name{font-size:.87rem;font-weight:600;color:var(--ink);display:block;line-height:1.25}
.offer-meta{font-size:.72rem;color:var(--dim);display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-top:.1rem}
.offer-buy{display:flex;align-items:center;gap:.5rem;margin-left:auto}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border-2);border-radius:8px;overflow:hidden;background:var(--card)}
.stepper button{border:0;background:transparent;width:26px;height:26px;cursor:pointer;color:var(--ink);font-size:1rem;line-height:1}
.stepper button:hover{background:var(--card-2)}
.stepper span{min-width:22px;text-align:center;font-family:var(--f-mono);font-size:.78rem}
.spec{width:100%;border-collapse:collapse;font-size:.84rem}
.spec th{text-align:left;font-weight:500;color:var(--dim);padding:.5rem .4rem;border-bottom:1px solid var(--border);width:40%;vertical-align:top}
.spec td{padding:.5rem .4rem;border-bottom:1px solid var(--border);color:var(--text)}
.nut{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:.4rem;margin:.5rem 0}
.nut div{background:var(--card-2);border:1px solid var(--border);border-radius:8px;padding:.4rem;text-align:center}
.nut b{display:block;font-family:var(--f-display);font-size:.86rem;color:var(--ink)}
.nut small{font-size:.6rem;color:var(--dim);font-family:var(--f-mono);text-transform:uppercase}
.veg{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;color:var(--teal);font-weight:500}
.veg i{width:12px;height:12px;border:1.5px solid currentColor;border-radius:2px;display:grid;place-items:center;font-style:normal;font-size:.5rem}

/* ---------- cart / checkout ---------- */
.cartgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,.85fr);gap:1rem;align-items:start}
@media (max-width:900px){.cartgrid{grid-template-columns:1fr}}
.cgroup{margin-bottom:.8rem;overflow:hidden}
.cgroup-head{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;background:var(--card-2);border-bottom:1px solid var(--border)}
.cline{display:flex;gap:.7rem;padding:.7rem .9rem;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap}
.cline:last-child{border-bottom:0}
.cemoji{width:44px;height:44px;border-radius:9px;background:var(--card-2);border:1px solid var(--border);display:grid;place-items:center;font-size:1.2rem;flex:0 0 auto}
.cline .info{flex:1 1 130px;min-width:0}
.cline .info b{font-size:.86rem;font-weight:600;color:var(--ink);display:block;line-height:1.3}
.cline .info small{color:var(--dim);font-size:.72rem}
.srow{display:flex;justify-content:space-between;gap:1rem;font-size:.85rem;padding:.3rem 0;color:var(--dim)}
.srow b{color:var(--ink);font-weight:500}
.stot{display:flex;justify-content:space-between;padding-top:.6rem;margin-top:.4rem;border-top:1px dashed var(--border-2);font-size:.95rem;font-weight:600}
.stot b{font-family:var(--f-display);font-size:1.15rem;color:var(--ink)}
.field{display:grid;gap:.25rem;margin-bottom:.7rem}
.field label{font-size:.68rem;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.field input,.field select,.field textarea{width:100%;font-family:var(--f-body);font-size:.88rem;color:var(--text);background:var(--card);border:1px solid var(--border-2);border-radius:8px;padding:.55rem .65rem}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.field textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .7rem;border:1px solid var(--border-2);border-radius:9px;cursor:pointer;background:var(--card);margin-bottom:.45rem}
.opt:has(input:checked){border-color:var(--amber);background:var(--amber-soft)}
.opt input{margin-top:.2rem;accent-color:var(--amber-2)}
.opt b{display:block;font-size:.85rem;color:var(--ink)}
.opt small{color:var(--dim);font-size:.72rem}
.hint{font-size:.74rem;color:var(--dim);background:var(--card-2);border:1px dashed var(--border-2);border-radius:8px;padding:.5rem .65rem;margin-top:.6rem}

/* ---------- invoice ---------- */
.invoice{max-width:780px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:clamp(1rem,2.6vw,1.8rem);box-shadow:var(--shadow-2)}
.inv-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:.8rem;margin-bottom:.8rem}
.inv-head h2{margin:0;font-size:1.15rem}
.inv-meta{font-size:.76rem;color:var(--dim);text-align:right}
.inv-meta b{color:var(--ink);font-family:var(--f-mono);font-size:.78rem}
.inv-table{width:100%;border-collapse:collapse;font-size:.82rem;margin:.6rem 0}
.inv-table th{text-align:left;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border-2);padding:.4rem .35rem}
.inv-table td{padding:.4rem .35rem;border-bottom:1px solid var(--border);vertical-align:top}
.inv-table .num{text-align:right;font-family:var(--f-mono);font-size:.78rem;white-space:nowrap}
.inv-tot{margin-left:auto;max-width:300px;width:100%}
.inv-note{font-size:.72rem;color:var(--dim);border-top:1px dashed var(--border-2);padding-top:.6rem;margin-top:.8rem}
.stamp{display:inline-block;border:2px solid var(--teal);color:var(--teal);border-radius:6px;padding:.15rem .5rem;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;transform:rotate(-2deg)}
.stamp.due{border-color:var(--amber-2);color:var(--amber-2)}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:210px minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:860px){.dash{grid-template-columns:1fr}}
.dnav{position:sticky;top:110px;overflow:hidden}
.dnav button{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;border:0;background:transparent;padding:.6rem .8rem;font-size:.85rem;color:var(--text);cursor:pointer;border-left:3px solid transparent}
.dnav button:hover{background:var(--card-2)}
.dnav button.on{background:var(--amber-soft);color:var(--amber-2);font-weight:600;border-left-color:var(--amber)}
@media (max-width:860px){.dnav{position:static;display:flex;overflow-x:auto}.dnav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}.dnav button.on{border-left:0;border-bottom-color:var(--amber)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin-bottom:1rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.75rem .85rem;position:relative;overflow:hidden}
.stat b{display:block;font-family:var(--f-display);font-size:1.35rem;color:var(--ink);line-height:1.1}
.stat small{font-size:.7rem;color:var(--dim)}
.stat::after{content:"";position:absolute;right:-20px;bottom:-20px;width:60px;height:60px;border-radius:50%;background:var(--amber-soft);opacity:.7}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th{text-align:left;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:.45rem .45rem;border-bottom:1px solid var(--border-2);white-space:nowrap}
.tbl td{padding:.5rem .45rem;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:hover td{background:var(--card-2)}
.tbl .num{text-align:right;font-family:var(--f-mono);font-size:.78rem}
.scroll{overflow:auto}
.bar{height:6px;border-radius:999px;background:var(--card-2);overflow:hidden;margin:.4rem 0}
.bar i{display:block;height:100%;background:var(--teal);border-radius:999px}
.kcard{padding:.8rem .9rem;margin-bottom:.6rem}
.mini-chart{display:flex;align-items:flex-end;gap:.3rem;height:70px;margin:.5rem 0}
.mini-chart div{flex:1;background:linear-gradient(180deg,var(--amber),var(--amber-2));border-radius:4px 4px 0 0;min-height:4px;position:relative}
.mini-chart div span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:.55rem;color:var(--dim);font-family:var(--f-mono)}

/* ---------- requirement / rfq ---------- */
.req{border:1px solid var(--border);border-radius:var(--r);padding:.8rem .9rem;margin-bottom:.7rem;background:var(--card)}
.req-head{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:flex-start}
.req-items{font-size:.8rem;color:var(--dim);margin:.4rem 0}
.req-items li{display:flex;justify-content:space-between;gap:.5rem;border-bottom:1px dashed var(--border);padding:.2rem 0}
.shoppick{display:flex;align-items:center;gap:.5rem;padding:.4rem .5rem;border:1px solid var(--border);border-radius:8px;margin-bottom:.35rem;font-size:.82rem;cursor:pointer}
.shoppick:has(input:checked){border-color:var(--amber);background:var(--amber-soft)}

/* ---------- auth / modal ---------- */
.auth{max-width:460px;margin:1.5rem auto;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:clamp(1rem,3vw,1.6rem);box-shadow:var(--shadow-2)}
.auth h1{font-size:1.4rem;margin-bottom:.2rem}
.auth .sub{color:var(--dim);font-size:.85rem;margin-bottom:1rem}
.seg{display:flex;background:var(--card-2);border-radius:9px;padding:.2rem;margin-bottom:.9rem;gap:.2rem}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:.4rem;font-size:.82rem;color:var(--dim);cursor:pointer;font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-1)}
.divider{display:flex;align-items:center;gap:.6rem;color:var(--dim);font-size:.68rem;margin:.8rem 0;font-family:var(--f-mono);letter-spacing:.1em}
.divider::before,.divider::after{content:"";height:1px;background:var(--border);flex:1}
.gbtn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.55rem;border:1px solid var(--border-2);border-radius:9px;background:var(--card);cursor:pointer;font-size:.85rem;color:var(--ink);font-weight:500}
.gbtn:hover{background:var(--card-2)}
.sheet{position:fixed;inset:0;background:rgba(10,20,32,.5);display:none;place-items:center;z-index:300;padding:1rem}
.sheet.on{display:grid}
.sheet-box{background:var(--card);border-radius:var(--r-lg);max-width:400px;width:100%;padding:1.2rem;box-shadow:var(--shadow-3);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.gacct{display:flex;align-items:center;gap:.6rem;padding:.55rem;border-radius:9px;cursor:pointer;border:1px solid transparent}
.gacct:hover{background:var(--card-2);border-color:var(--border)}

/* ---------- footer ---------- */
.foot{background:var(--card);border-top:1px solid var(--border);margin-top:2rem;padding:1.6rem 0 1rem}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:1.4rem}
@media (max-width:820px){.fgrid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.foot h4{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:.6rem;font-weight:500}
.foot ul{display:grid;gap:.35rem;font-size:.82rem}
.foot a{color:var(--text)}
.foot p{font-size:.82rem;color:var(--dim);max-width:34ch}
.fbottom{max-width:var(--maxw);margin:1.2rem auto 0;padding:1rem 1rem 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;font-size:.76rem;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:9px;font-size:.84rem;box-shadow:var(--shadow-3);z-index:400;transition:transform .25s;max-width:calc(100% - 2rem);text-align:center}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}




/* ---- voice search overlay ---- */

.locbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:center;padding:.7rem .2rem .2rem}
.locpill{display:inline-flex;align-items:center;gap:.4rem;background:var(--card);border:1px solid var(--border-2);border-radius:999px;padding:.4rem .8rem;font-size:.84rem;color:var(--ink);cursor:pointer;font-family:inherit;box-shadow:var(--shadow-1)}
.locpill:hover{border-color:var(--amber);background:var(--amber-soft)}
.locpill b{font-weight:600}

.aifab-lbl{position:absolute;bottom:-1.15rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.6rem;letter-spacing:.08em;padding:.1rem .35rem;border-radius:999px;font-family:var(--f-mono)}
.aifab{display:flex;align-items:center;justify-content:center;position:fixed;right:1rem;bottom:1rem;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(140deg,var(--amber),var(--amber-2));color:#3a2200;font-size:1.5rem;cursor:pointer;box-shadow:var(--shadow-3);z-index:320;animation:aibob 3s ease-in-out infinite}
@keyframes aibob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.aipanel{position:fixed;right:1rem;bottom:4.6rem;width:min(360px,calc(100% - 2rem));max-height:70vh;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-3);display:none;flex-direction:column;z-index:320;overflow:hidden}
.aipanel.on{display:flex;animation:pop .2s ease}
.aihead{display:flex;align-items:center;justify-content:space-between;padding:.6rem .7rem;border-bottom:1px solid var(--border);background:var(--card-2)}
.aihead b{display:block;font-size:.9rem;font-family:var(--f-display)}
.aihead small{font-size:.68rem;color:var(--dim)}
.ailogo{width:30px;height:30px;border-radius:9px;background:var(--amber-soft);display:grid;place-items:center}
.aibody{flex:1;overflow-y:auto;padding:.7rem;display:flex;flex-direction:column;gap:.5rem;min-height:180px}
.msg{max-width:85%;padding:.5rem .65rem;border-radius:12px;font-size:.84rem;line-height:1.45}
.msg.bot{background:var(--card-2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--amber-soft);align-self:flex-end;border-bottom-right-radius:4px}
.msg img{max-width:100%;border-radius:8px;margin-top:.3rem}
.msg a{color:var(--navy-2);text-decoration:underline}
.aisettings{display:none;padding:.6rem .7rem;border-top:1px solid var(--border);background:var(--card-2)}
.aisettings.on{display:block}
.aifoot{display:flex;gap:.35rem;align-items:center;padding:.5rem;border-top:1px solid var(--border);background:var(--card-2)}
.aifoot input{flex:1;min-width:0;border:1px solid var(--border-2);border-radius:999px;padding:.45rem .7rem;font-size:.82rem;background:var(--card);color:var(--text);font-family:var(--f-body)}
.aifoot input:focus{outline:none;border-color:var(--amber)}
.inv-brand{display:flex;align-items:center;gap:.6rem;border-bottom:2px solid var(--ink);padding-bottom:.7rem;margin-bottom:.7rem}
.inv-brand b{font-family:var(--f-display);font-size:1.15rem;color:var(--ink);display:block;line-height:1.1}
.inv-brand small{font-size:.7rem;color:var(--dim);font-family:var(--f-mono);letter-spacing:.06em}
.inv-brand-tag{margin-left:auto;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border:1px solid var(--border-2);border-radius:999px;padding:.15rem .5rem}
.pvbar{position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;display:none;gap:.6rem;align-items:center;background:var(--ink);color:var(--bg);padding:.45rem .7rem;border-radius:999px;font-size:.8rem;z-index:400;box-shadow:var(--shadow-3)}
.roleswitch{display:inline-flex;background:var(--card-2);border:1px solid var(--border);border-radius:999px;padding:2px}
.roleswitch a{font-size:.76rem;padding:.3rem .6rem;border-radius:999px;color:var(--dim);text-decoration:none}
.roleswitch a.on{background:var(--navy);color:#fff}
.catbox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:.9rem;box-shadow:var(--shadow-1)}
.rank{width:22px;height:22px;border-radius:50%;background:var(--amber-soft);color:var(--amber-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:.68rem;font-weight:700;flex:0 0 auto}
.vmodal{position:fixed;inset:0;background:rgba(8,18,30,.62);display:none;place-items:center;z-index:500;backdrop-filter:blur(3px)}
.vmodal.on{display:grid;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.vbox{background:var(--card);border-radius:22px;padding:1.6rem 2rem;text-align:center;max-width:320px;width:calc(100% - 2rem);box-shadow:var(--shadow-3)}
.vbox b{display:block;font-family:var(--f-display);font-size:1.15rem;color:var(--ink);margin-top:.9rem}
.vbox small{display:block;color:var(--dim);font-size:.78rem;margin:.25rem 0 .9rem}
.vstage{position:relative;width:110px;height:110px;margin:0 auto;display:grid;place-items:center}
.vmic{font-size:2.2rem;position:relative;z-index:2;animation:micbob 1.1s ease-in-out infinite}
@keyframes micbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.vring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--amber);opacity:0;animation:pulse 1.8s ease-out infinite}
.vring.r2{animation-delay:.6s}.vring.r3{animation-delay:1.2s}
@keyframes pulse{0%{transform:scale(.55);opacity:.85}100%{transform:scale(1.25);opacity:0}}
.vmodal.listening .vmic{animation:micbob .7s ease-in-out infinite}
.micbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--amber-soft);border:1px solid var(--amber);color:#3a2200;font-size:.95rem;cursor:pointer;transition:transform .15s}
.micbtn:hover{transform:scale(1.06)}
.micbtn.rec{animation:micrec 1s infinite;background:var(--red);color:#fff;border-color:var(--red)}
@keyframes micrec{0%,100%{box-shadow:0 0 0 0 rgba(208,52,44,.45)}50%{box-shadow:0 0 0 8px rgba(208,52,44,0)}}
@media (prefers-reduced-motion:reduce){.vring,.vmic{animation:none}}
.search-wrap{position:relative;flex:1 1 320px;min-width:0}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-2);display:none;z-index:90;max-height:330px;overflow-y:auto}
.sg-head{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:.4rem .7rem;background:var(--card-2);position:sticky;top:0}
.sg-item{display:flex;gap:.5rem;align-items:center;padding:.45rem .7rem;font-size:.85rem;color:var(--ink)}
.sg-item:hover{background:var(--card-2);text-decoration:none}
.sg-item .sg-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-item small{font-family:var(--f-mono);color:var(--dim);font-size:.72rem}
.micbtn{border:0;background:transparent;font-size:1rem;cursor:pointer;padding:.2rem .35rem;line-height:1}
.starbtn{background:none;border:0;font-size:1.7rem;cursor:pointer;color:var(--border-2);padding:0 .1rem;line-height:1}
.ticker{background:linear-gradient(90deg,var(--amber),var(--amber-2));color:#3a2200;overflow:hidden;white-space:nowrap;font-size:.78rem;font-weight:600}
.ticker-track{display:inline-block;padding:.3rem 0;animation:marq 45s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ttime{display:block;font-family:var(--f-mono);font-size:.66rem;color:var(--dim);margin-top:.15rem}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}
.track{display:grid;gap:.1rem;margin:.9rem 0 1rem}
.tstep{display:flex;gap:.7rem;align-items:flex-start;position:relative;padding-bottom:1.1rem}
.tstep:last-child{padding-bottom:0}
.tstep::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--border-2)}
.tstep:last-child::before{display:none}
.tstep.done::before,.tstep.now::before{background:var(--teal)}
.tdot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:var(--card-2);border:2px solid var(--border-2);color:var(--dim);font-family:var(--f-mono);font-size:.72rem;z-index:1}
.tstep.done .tdot{background:var(--teal);border-color:var(--teal);color:#fff}
.tstep.now .tdot{background:var(--amber);border-color:var(--amber);color:#3a2200;font-weight:700}
.tstep b{display:block;font-size:.88rem;color:var(--ink);font-weight:600;line-height:1.6}
.tstep.now b{color:var(--amber-2)}
.tstep small{font-size:.7rem;color:var(--dim);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em}

@media print{
  .strip,.header,.catbar,.foot,.no-print,.toast,.crumbs{display:none!important}
  body{background:#fff}
  .invoice{border:0;box-shadow:none;max-width:none;padding:0}
}
</style>
</head>
<body>
<header class="header" id="header"></header>
<main id="app"></main>
<footer class="foot" id="foot"></footer>
<button class="aifab" id="aiFab" onclick="A.aiOpen()" aria-label="Dukaan Saathi"><span style="font-size:1.35rem">🤖</span><span class="aifab-lbl">AI</span></button>
<div class="aipanel" id="aiPanel">
  <div class="aihead">
    <div class="row" style="gap:.5rem">
      <span class="ailogo">🤖</span>
      <div><b>दुकान साथी</b><small>AI · हिन्दी / English</small></div>
    </div>
    <div class="row" style="gap:.2rem"><button class="btn btn-sm btn-ghost" id="aiVoiceBtn" onclick="A.aiVoiceToggle()" title="आवाज़">🔊</button><button class="btn btn-sm btn-ghost" onclick="A.aiToggleSettings()" title="AI सेटिंग">⚙</button>
    <button class="btn btn-sm btn-ghost" onclick="A.aiClose()">✕</button></div>
  </div>
  <div class="aibody" id="aiBody"></div>
  <div class="aisettings" id="aiSettings">
    <div class="field"><label>AI provider</label>
      <select id="aiProvider" onchange="A.aiProviderChange()">
        <option value="sarvam">Sarvam AI</option>
        <option value="gemini">Google Gemini</option>
        <option value="local">Built-in (no key)</option>
      </select></div>
    <div class="field"><label>API key</label><input id="aiKey" type="password" placeholder="key..."></div>
    <div class="two"><div class="field"><label>Model</label><input id="aiModel" value="sarvam-m"></div>
    <div class="field"><label>Endpoint</label><input id="aiUrl" value="https://api.sarvam.ai/v1/chat/completions"></div></div>
    <div class="row"><button class="btn btn-sm btn-primary" onclick="A.aiSave()">सेव करें</button>
      <button class="btn btn-sm btn-ghost" onclick="A.aiClear()">हटाएँ</button></div>
    <p class="dim" style="font-size:.7rem;margin:.4rem 0 0">Key सिर्फ़ इसी ब्राउज़र में रहती है। सार्वजनिक साइट पर key डालना सुरक्षित नहीं होता।</p>
  </div>
  <div class="aifoot">
    <button class="micbtn" onclick="A.aiMic()" title="बोलिए">🎤</button>
    <button class="micbtn" onclick="A.aiCam()" title="कैमरा">📷</button>
    <button class="micbtn" onclick="A.aiGallery()" title="गैलरी">🖼️</button>
    <input id="aiFile" type="file" accept="image/*" style="display:none" onchange="A.aiPick(this)">
    <input id="aiInput" placeholder="कुछ पूछिए… जैसे: आलू 2 किलो जोड़ो" onkeydown="if(event.key==='Enter')A.aiSend()">
    <button class="btn btn-sm btn-primary" onclick="A.aiSend()">भेजें</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="vmodal" id="vmodal">
  <div class="vbox">
    <div class="vstage"><span class="vring r1"></span><span class="vring r2"></span><span class="vring r3"></span><span class="vmic">🎤</span></div>
    <b id="vtitle">बोलिए…</b>
    <small id="vsub">सुन रहे हैं, अब बोलने का समय है</small>
    <button class="btn btn-sm btn-ghost" onclick="A.voiceStop()">रद्द करें</button>
  </div>
</div>
<div class="sheet" id="sheet"><div class="sheet-box" id="sheetBox"></div></div>
<script>
window.APP_MODE="all";
(function () {

function ensureShopOffers(db){
  db.shops.forEach(function(sh){
    var num=parseInt(String(sh.id).slice(1),10);
    if(!sh.type||num<=6) return;

    db.products.forEach(function(p){
      if(cats.indexOf(p.c)===-1) return;
      if(p.of.some(function(o){return o.s===sh.id;})) return;
      var h=hashN(p.id+sh.id);
      if(h%100>60) return;
      var base=Math.min.apply(null,p.of.map(function(o){return o.m||o.p;}));
      if(!isFinite(base)||!base) base=50;
      p.of.push({s:sh.id,p:Math.max(1,Math.round(base*(0.90+((h%17)/100)))),m:base,st:5+(h%40)});
    });
  });

}

/* ---------------- shared cards ---------------- */
function slogo(s){ return '<span class="slogo">'+(s.logo?'<img src="'+s.logo+'" alt="">':(s.emoji||"🏪"))+'</span>'; }
function effOffer(p){
  if(DB.shopFilter){ var x=(p.of||[]).filter(function(o){return o.s===DB.shopFilter;})[0]; return x||null; }
  return bestOffer(p);
}
function pcard(p,sid){
  var o=sid?(p.of||[]).filter(function(x){return x.s===sid;})[0]:effOffer(p); if(!o) return "";
  var n=sid?1:offersOf(p).length, off=offPct(o);
  return '<a class="pcard" href="#p/'+p.id+'">'+
    '<div class="pthumb">'+(p.img?'<img src="'+p.img+'" alt="'+esc(L(p.n))+'">':thumbArt(p))+(off?'<span class="disc">'+off+"% "+esc(t("off"))+'</span>':"")+
      '<span class="shops">'+n+" "+esc(t("shops"))+'</span></div>'+
    '<div class="pbody"><span class="pbrand">'+esc(p.b)+'</span>'+
      '<h3 class="pname">'+esc(L(p.n))+'</h3>'+
      (p.kind?'<span class="tag '+(p.kind==="open"?"a":p.kind==="desi"?"g":"b")+'" style="font-size:.6rem;align-self:flex-start">'+esc(kindLabel(p.kind))+'</span>':"")+
      '<span class="prate"><i>★ '+p.rating.toFixed(1)+'</i>'+(p.reviews>999?(Math.round(p.reviews/100)/10)+"k":p.reviews)+'</span>'+
      '<div class="pprice"><b>'+money(o.p)+'</b>'+(o.m>o.p?'<s>'+money(o.m)+'</s><span class="off">'+off+"% "+esc(t("off"))+'</span>':"")+'</div>'+
      '<button class="addmini" onclick="event.preventDefault();event.stopPropagation();A.add(\''+p.id+'\',\''+o.s+'\')">'+esc(t("Add"))+'</button>'+
    '</div></a>';
}
function shopcard(s){
  return '<a class="shopcard" href="#s/'+s.id+'">'+slogo(s)+
    '<div style="min-width:0"><h3>'+esc(L(s.name))+'</h3>'+
    '<div class="smeta"><span class="dist">'+sDist(s).toFixed(1)+' km</span>'+
      '<span>★ '+s.rating.toFixed(1)+'</span>'+
      '<span>'+esc(s.hours)+'</span>'+
      (s.delivery?'<span class="tag g">'+esc(t("Delivery"))+'</span>':"")+
      (s.udhaari?'<span class="tag a">'+esc(t("Khata"))+'</span>':"")+
    '</div></div></a>';
}
function crumbs(items){
  return '<div class="wrap"><div class="crumbs">'+items.map(function(it,i){
    return (i?'<span style="opacity:.5">/</span>':"")+(it.href?'<a href="'+it.href+'">'+esc(it.label)+'</a>':"<span>"+esc(it.label)+"</span>");
  }).join("")+"</div></div>";
}

function vList(){
  var q=(DB.q||"").toLowerCase().trim();
  var list=DB.products.filter(function(p){
    if(DB.cat&&DB.cat!=="all"&&p.c!==DB.cat) return false;
    if(DB.shopFilter && !(p.of||[]).some(function(o){return o.s===DB.shopFilter;})) return false;
    var o=effOffer(p); if(!o) return false;
    if(DB.f.pmin&&o.p<DB.f.pmin) return false;
    if(DB.f.pmax&&o.p>DB.f.pmax) return false;
    if(DB.f.brand&&DB.f.brand!=="all"&&p.b!==DB.f.brand) return false;
    if(DB.f.open&&!offersOf(p).some(function(x){return openNow(shopById(x.s));})) return false;
    if(DB.f.delivery&&!offersOf(p).some(function(x){var sh=shopById(x.s);return sh&&sh.delivery;})) return false;
    if(DB.f.price==="low"&&o.p>100) return false;
    if(DB.f.disc&&offPct(o)<DB.f.disc) return false;
    if(DB.f.instock&&o.st<=0) return false;
    if(q&&!matchQuery(p,q)) return false;
    return true;
  });
  if(DB.sort==="low") list.sort(function(a,b){var x=effOffer(a),y=effOffer(b);return (x?x.p:0)-(y?y.p:0);});
  else if(DB.sort==="high") list.sort(function(a,b){var x=effOffer(a),y=effOffer(b);return (y?y.p:0)-(x?x.p:0);});
  else if(DB.sort==="rating") list.sort(function(a,b){return avgRating(b)-avgRating(a);});
  else list.sort(function(a,b){var x=effOffer(a),y=effOffer(b);return offPct(y)-offPct(x);});

  var shopBanner="";

function hostCustomers(){
  var m={};
  DB.orders.forEach(function(o){
    var k=o.cust.mobile||"?"; if(!m[k]) m[k]={name:o.cust.name,mobile:k,email:o.cust.email||"",addr:o.cust.addr||"",orders:0,spent:0,paid:0};
    m[k].orders++; m[k].spent+=o.total; m[k].paid+=o.paid;
    if(o.cust.addr) m[k].addr=o.cust.addr;
  });
  DB.khata.forEach(function(k){ if(!m[k.mobile]) m[k.mobile]={name:k.name,mobile:k.mobile,email:"",addr:"",orders:0,spent:0,paid:0}; });
  if(DB.customer&&DB.customer.mobile&&!m[DB.customer.mobile]){
    m[DB.customer.mobile]={name:DB.customer.name,mobile:DB.customer.mobile,email:DB.customer.email||"",addr:DB.customer.addr||"",orders:0,spent:0,paid:0};
  }
  return Object.keys(m).map(function(k){return m[k];});
}

function invText(o){
  var lines=[L(o.shop.name)+" — "+t("Invoice")+" "+o.no, t("Date")+": "+o.date, ""];

}

function vTrack(oid){
  var o=null; DB.orders.forEach(function(x){if(x.id===oid) o=x;});
  if(!o) return '<div class="wrap"><div class="empty">'+esc(t("No orders yet"))+'</div></div>';

             ["confirmed",DB.lang==="hi"?"दुकानदार ने कन्फर्म किया":"Confirmed by shop"],
             ["packed",DB.lang==="hi"?"सामान तैयार":"Packed"],

  var idx=0; steps.forEach(function(x,i){ if(x[0]===o.status) idx=i; });

  if(o.status==="new") msg=(DB.lang==="hi"?"ऑर्डर दुकानदार तक पहुँच गया है। वह कन्फर्म करेगा, फिर आपको यहीं दिख जाएगा।":"Your order has reached the shop. It will show as confirmed once the shopkeeper accepts it.");

  return '<div class="wrap sec"><div class="row no-print" style="justify-content:space-between;margin-bottom:.8rem">'+
    '<a class="btn btn-ghost btn-sm" href="#account">'+esc(t("My orders"))+'</a>'+
    '<div class="row"><a class="btn btn-sm btn-ghost" href="#o/'+o.id+'">'+esc(t("Invoice"))+'</a>'+
    '<a class="btn btn-sm btn-ghost" href="tel:'+esc(o.shop.phone)+'">'+IC.phone+' '+esc(t("Call shop"))+'</a></div></div>'+
  '<div class="card pad" style="max-width:720px;margin:0 auto">'+
    '<div class="row" style="justify-content:space-between;align-items:flex-start">'+
      '<div class="row" style="gap:.6rem">'+slogo(o.shop)+'<div><b style="font-family:var(--f-display);font-size:1.05rem">'+esc(L(o.shop.name))+'</b>'+
      '<div class="dim" style="font-size:.76rem">'+esc(o.no)+' · '+esc(o.date)+'</div></div></div>'+
      '<span class="tag '+(o.status==="done"?"g":o.status==="new"?"a":"b")+'">'+esc(stLabel(o))+'</span></div>'+
    '<div class="track">'+timeline+'</div>'+
    '<div class="hint" style="margin-bottom:.8rem">'+esc(msg)+'</div>'+
    '<div class="dim" style="font-size:.78rem;margin-bottom:.6rem">'+(DB.lang==="hi"?"ऑर्डर "+fmt12((o.t&&o.t.placed)||Date.now())+" पर किया गया":"Ordered at "+fmt12((o.t&&o.t.placed)||Date.now()))+'</div>'+

  var myKhata=DB.khata.filter(function(k){return k.shopId===s.id;});
  var today=todayISO();
  var sum=function(list){return list.reduce(function(n,o){return n+o.total;},0);};
  var dToday=myOrders.filter(function(o){return o.iso===today;});
  var dWeek=myOrders.filter(function(o){return (new Date()-new Date(o.iso))/86400000<=7;});

  var sent=DB.reqs.filter(function(r){return r.fromShopId===s.id;});

  chatUnderstand:function(text){
    var t=String(text||"").toLowerCase();
    var R={action:"unknown",items:[]};
    if(/मदद|help|क्या कर सकते|what can you/.test(t)){ R.action="help"; return R; }
    if(/ऑर्डर कहाँ|कहाँ है|status|ट्रैक|track|क्या हुआ/.test(t)){ R.action="status"; return R; }
    if(/कितना|total|कुल|बिल|हिसाब/.test(t) && !/जोड़|डाल|add/.test(t)){ R.action="total"; return R; }
    if(/कूपन|coupon|छूट|discount|ऑफर/.test(t)){ R.action="coupons"; return R; }
    if(/हटा|हटाओ|remove|delete|मत चाहिए|नहीं चाहिए/.test(t)){ R.action="remove"; R.items=this.chatParseItems(t); return R; }
    if(/^(हाँ|हां|yes|ok|ठीक|कर दो|ऑर्डर कर|confirm|place|done|ले लो)/.test(t) || /ऑर्डर (कर|पक्का|कन्फर्म)/.test(t)){ R.action="confirm"; return R; }
    if(/^(नहीं|ना|no|cancel|रद्द|मत करो)/.test(t)){ R.action="cancel"; return R; }
    if(/^(साफ|clear|सब हटा)/.test(t)){ R.action="clear"; return R; }
    if(/जोड़|डाल|add|buy|चाहिए|ले लो|दो|किलो|kg|litre|लीटर|पैक/.test(t)){ R.items=this.chatParseItems(t); if(R.items.length) R.action="add"; }
    return R;
  },
  chatParseItems:function(text){
    var NUMW={"एक":1,"दो":2,"तीन":3,"चार":4,"पांच":5,"पाँच":5,"छह":6,"सात":7,"आठ":8,"नौ":9,"दस":10,
      "one":1,"two":2,"three":3,"four":4,"five":5,"six":6,"seven":7,"eight":8,"nine":9,"ten":10,"half":0.5,"आधा":0.5,"a":1,"an":1};
    var parts=String(text).split(/और|,|\band\b|\+|के साथ/).map(function(x){return x.trim();}).filter(Boolean);
    var out=[];
    parts.forEach(function(part){
      var qty=1, m=part.match(/(\d+(?:\.\d+)?)/);
      if(m) qty=parseFloat(m[1]);
      else { Object.keys(NUMW).forEach(function(w){ if(part.indexOf(w)>-1 && qty===1) qty=NUMW[w]; }); }
      if(/आधा|half/.test(part) && qty>1) qty=0.5;
      var q=part.replace(/[0-9.]/g,"").replace(/किलो|kg|किलोग्राम|ग्राम|gram|g\b|लीटर|litre|liter|ml|मिली|पैक|pack|दर्जन|dozen|नग|pc|pcs|जोड़ो|जोड़|डालो|डाल|add|buy|चाहिए|ले लो|का|की|के|मुझे|please|कर दो|दो/g," ").trim();
      if(!q) return;
      var hits=DB.products.filter(function(p){ return matchLoose(p,q); });
      if(!hits.length) return;
      hits.sort(function(a,b){ return (L(a.n).length-L(b.n).length); });
      var p=hits[0], o=bestOffer(p);
      if(o) out.push({pid:p.id,sid:o.s,qty:Math.max(1,Math.round(qty)),name:L(p.n),price:o.p});
    });
    return out;
  },
  chatTotal:function(){
    var sub=0; DB.cart.forEach(function(i){ var p=prodById(i.pid); if(!p) return;
      var o=p.of.filter(function(x){return x.s===i.sid;})[0]; if(o) sub+=o.p*i.qty; });
    return sub;
  },
  chatCartText:function(){
    if(!DB.cart.length) return DB.lang==="hi"?"कार्ट खाली है।":"Your cart is empty.";
    var lines=DB.cart.map(function(i){ var p=prodById(i.pid); var o=p&&p.of.filter(function(x){return x.s===i.sid;})[0];
      return "• "+L(p.n)+" × "+i.qty+" — "+money((o?o.p:0)*i.qty); }).join("<br>");
    return lines+"<br><b>"+(DB.lang==="hi"?"कुल: ":"Total: ")+money(this.chatTotal())+"</b>";
  },
  chatPlace:function(){
    if(!DB.cart.length){ A.aiSay(DB.lang==="hi"?"कार्ट खाली है — पहले कुछ सामान बताइए।":"Cart is empty — tell me what to add."); return; }
    var u=DB.customer;
    if(!u||!u.mobile){ A._chatStage="name";
      A.aiSay(DB.lang==="hi"?"ऑर्डर के लिए आपका नाम बताइए।":"Please tell me your name for the order."); return; }
    var gs=groups(), made=[], iso=todayISO(), dateStr=new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
    var gid="g"+uid();
    gs.forEach(function(g){
      var sub=0,items=[];
      g.items.forEach(function(i){ var p=prodById(i.pid),o=p.of.filter(function(x){return x.s===g.sid;})[0];
        sub+=o.p*i.qty; items.push({pid:p.id,name:L(p.n),unit:L(p.u),qty:i.qty,price:o.p}); });
      var fee=feeFor(sub,"delivery",sDist(g.shop)), total=sub+fee, n=uid();
      DB.orders.push({id:"o"+n,no:"DK-"+new Date().getFullYear()+"-"+String(n).slice(-4),grp:gid,grpNo:gid,
        date:dateStr,iso:iso,shopId:g.sid,
        shop:{name:g.shop.name,addr:g.shop.addr,phone:g.shop.phone,emoji:g.shop.emoji,logo:g.shop.logo,upi:g.shop.upi||"",qr:g.shop.qr||"",reg:g.shop.reg||""},
        items:items,sub:sub,fee:fee,disc:0,coupon:null,slot:"today",total:total,paid:0,mode:"delivery",pay:"cash",
        status:"new",bag:false,t:{placed:Date.now()},cust:{name:u.name,mobile:u.mobile,addr:u.addr||"",email:u.email||""},mobile:u.mobile});
      made.push(DB.orders[DB.orders.length-1]);
    });
    DB.cart=[]; save(); render();
    A.aiSay((DB.lang==="hi"?"✅ ऑर्डर हो गया! नंबर <b>":"✅ Order placed! Number <b>")+made[0].no+"</b> — "+money(made[0].total)+
      '<br><a href="#track/'+made[0].id+'">'+(DB.lang==="hi"?"ऑर्डर ट्रैक करें":"Track order")+'</a> · <a href="#o/'+made[0].id+'">'+(DB.lang==="hi"?"बिल देखें":"View bill")+'</a>');
  },
  aiDoActions:function(acts){
    if(!acts||!acts.length) return;
    acts.forEach(function(a){
      if(!a||!a.action) return;
      if(a.action==="add"&&a.name){
        var items=A.chatParseItems((a.qty||1)+" "+a.name);
        if(items.length){ items[0].qty=Math.max(1,Number(a.qty)||items[0].qty);
          var c=inCart(items[0].pid,items[0].sid); if(c) c.qty+=items[0].qty; else DB.cart.push({pid:items[0].pid,sid:items[0].sid,qty:items[0].qty});
          save(); render(); }
      } else if(a.action==="remove"&&a.name){
        var it=A.chatParseItems(a.name);
        if(it.length){ DB.cart=DB.cart.filter(function(c){return c.pid!==it[0].pid;}); save(); render(); }
      } else if(a.action==="search"&&a.query){ DB.q=a.query; DB.cat="all"; DB.limit=48; save(); }
      else if(a.action==="shop"&&a.shop){ var sh=DB.shops.filter(function(x){return (x.name.hi+" "+x.name.en).toLowerCase().indexOf(String(a.shop).toLowerCase())>-1;})[0];
        if(sh){ DB.shopFilter=sh.id; save(); } }
      else if(a.action==="coupon"&&a.code){ DB.coupon=String(a.code).toUpperCase(); save(); }
      else if(a.action==="lang"&&a.code){ DB.lang=a.code; save(); }
      else if(a.action==="clear"){ DB.cart=[]; save(); render(); }
      else if(a.action==="checkout"){ try{ location.hash="#checkout"; }catch(e){} }
    });
  },
  aiLocal:function(q){
    var hi=DB.lang==="hi";
    var say=function(x){ A.aiSay(x); };
    // --- collecting details step by step ---
    if(A._chatStage==="name"){ DB.customer=DB.customer||{}; DB.customer.name=String(q).trim(); save();
      A._chatStage="phone"; say(hi?"धन्यवाद! अब 10 अंकों का मोबाइल नंबर बताइए।":"Thanks! Now your 10-digit mobile number."); return; }
    if(A._chatStage==="phone"){ var ph=(String(q).match(/\d{10}/)||[])[0];
      if(!ph){ say(hi?"10 अंकों का मोबाइल नंबर चाहिए।":"Please send a 10-digit mobile number."); return; }
      DB.customer=DB.customer||{}; DB.customer.mobile=ph; save();
      A._chatStage="addr"; say(hi?"अब पूरा पता बताइए — मकान नंबर, गली, इलाका, पिन।":"Now your full address — house no., street, area, PIN."); return; }
    if(A._chatStage==="addr"){ DB.customer=DB.customer||{}; DB.customer.addr=String(q).trim(); save();
      A._chatStage=null; say(hi?"पता सेव हो गया ✓":"Address saved ✓"); A.chatPlace(); return; }

    var R=A.chatUnderstand(q);
    if(R.action==="help"){ say(hi?"मैं ये कर सकता हूँ:<br>• “आलू 2 किलो और 1 दूध” — सामान जोड़ना<br>• “आलू हटा दो”, “साफ करो”<br>• “कुल कितना”, “कार्ट”<br>• “ऑर्डर कर दो” — ऑर्डर पक्का करना<br>• “मेरा ऑर्डर कहाँ है”<br>• “कूपन”<br>बोलकर भी बोल सकते हैं।":"I can: add items (“2 kg potato and 1 milk”), remove or clear, show the total, place the order (“confirm”), show order status, and list coupons."); return; }
    if(R.action==="add" && R.items.length){
      R.items.forEach(function(it){ var c=inCart(it.pid,it.sid); if(c) c.qty+=it.qty; else DB.cart.push({pid:it.pid,sid:it.sid,qty:it.qty}); });
      save(); render();
      say(hi?"✅ जोड़ दिया:":"✅ Added: "+"<br>"+R.items.map(function(it){return "• "+esc(it.name)+" × "+it.qty+" — "+money(it.price*it.qty);}).join("<br>"));
      if(hi) say(R.items.map(function(it){return "• "+esc(it.name)+" × "+it.qty+" — "+money(it.price*it.qty);}).join("<br>"));
      say("<b>"+(hi?"अब कुल: ":"Now total: ")+money(A.chatTotal())+"</b><br>"+(hi?"ऑर्डर कर दूँ? “हाँ” लिखिए।":"Shall I place the order? Say “yes”."));
      return; }
    if(R.action==="remove"){
      if(R.items.length){ R.items.forEach(function(it){ DB.cart=DB.cart.filter(function(c){return c.pid!==it.pid;}); }); save(); render();
        say(hi?"हटा दिया।":"Removed."); } else if(/सब|all/.test(String(q).toLowerCase())){ DB.cart=[]; save(); render(); say(hi?"कार्ट खाली कर दिया।":"Cart cleared."); }
      else say(hi?"कौन-सा सामान हटाना है?":"Which item should I remove?");
      say(A.chatCartText()); return; }
    if(R.action==="clear"){ DB.cart=[]; save(); render(); say(hi?"कार्ट खाली कर दिया।":"Cart cleared."); return; }
    if(R.action==="total"){ say(A.chatCartText()); return; }
    if(R.action==="coupons"){ say(hi?"कोड: <b>SAVE10</b> (10%, ₹100 तक), <b>FIRST50</b> (₹50, ₹300 से ऊपर), <b>DHAMAKA</b> (15%, ₹200 तक)।":"Codes: <b>SAVE10</b>, <b>FIRST50</b>, <b>DHAMAKA</b>."); return; }
    if(R.action==="status"){
      if(!DB.customer){ say(hi?"पहले लॉगिन कीजिए।":"Please log in first."); return; }
      var mine=DB.orders.filter(function(o){return o.mobile===DB.customer.mobile;});
      if(!mine.length){ say(hi?"अभी कोई ऑर्डर नहीं है।":"No orders yet."); return; }
      var last=mine[mine.length-1];
      say(hi?("आपका ऑर्डर <b>"+last.no+"</b> — "+esc(stLabel(last))+'. <a href="#track/'+last.id+'">ट्रैक करें</a>'):("Order <b>"+last.no+"</b> — "+esc(stLabel(last))+'. <a href="#track/'+last.id+'">Track</a>')); return; }
    if(R.action==="confirm"){ A.chatPlace(); return; }
    if(R.action==="cancel"){ say(hi?"ठीक है, कुछ नहीं किया।":"Okay, nothing done."); return; }
    // unknown → try to find something
    var res=DB.products.filter(function(p){return matchLoose(p,q);}).slice(0,3);
    if(res.length){ say((hi?"ये मिला — कहिए तो जोड़ दूँ: ":"Found these — say the word and I will add them: ")+
      res.map(function(p){return '<a href="#p/'+p.id+'">'+esc(L(p.n))+'</a>';}).join(" · ")); return; }
    say(hi?"समझ नहीं आया। “मदद” लिखिए, या जैसे कहिए “आलू 2 किलो जोड़ो”।":"I did not catch that. Type “help”, or say “add 2 kg potato”.");
  },

function parse(){ var h=(location.hash||"#home").replace(/^#/,""); var p=h.split("/"); return {name:p[0]||"home",id:p[1]||""}; }
var lastKey=null;
function bindSearch(){
  var inp=document.getElementById("q"), box=document.getElementById("sugg");
  if(!inp||!box) return;
  inp.addEventListener("input",function(){
    var v=(inp.value||"").trim().toLowerCase();
    if(v.length<2){ box.style.display="none"; box.innerHTML=""; return; }
    var hits=DB.products.filter(function(p){return matchLoose(p,v);}).slice(0,6);
    var shopHits=DB.shops.filter(function(sh){return (L(sh.name)+" "+sh.name.hi+" "+sh.name.en).toLowerCase().indexOf(v)>-1;}).slice(0,3);
    var rec=(DB.recent||[]).filter(function(r){return r.toLowerCase().indexOf(v)>-1 && r.toLowerCase()!==v;}).slice(0,3);
    if(!hits.length&&!rec.length){ box.style.display="none"; return; }
    var html="";
    if(shopHits.length) html+='<div class="sg-head">'+(DB.lang==="hi"?"दुकानें":"Shops")+'</div>'+shopHits.map(function(sh){
      return '<a class="sg-item" href="#s/'+sh.id+'"><span class="sg-e">'+sh.emoji+'</span><span class="sg-n">'+esc(L(sh.name))+'</span><small>'+(DB.lang==="hi"?"दुकान":"shop")+'</small></a>';}).join("");
    if(hits.length) html+='<div class="sg-head">'+(DB.lang==="hi"?"सामान":"Products")+'</div>'+hits.map(function(p){
      var o=bestOffer(p);
      return '<a class="sg-item" href="#p/'+p.id+'"><span class="sg-e">'+p.e+'</span><span class="sg-n">'+esc(L(p.n))+'</span><small>'+money(o?o.p:0)+'</small></a>';}).join("");
    if(rec.length) html+='<div class="sg-head">'+(DB.lang==="hi"?"पिछली खोज":"Recent searches")+'</div>'+rec.map(function(r){
      return '<a class="sg-item" href="#products" onclick="return A.quickSearch(this.dataset.q)" data-q="'+esc(r)+'"><span class="sg-e">🔍</span><span class="sg-n">'+esc(r)+'</span></a>';}).join("");
    box.innerHTML=html; box.style.display="block";
  });
  inp.addEventListener("keydown",function(e){ if(e.key==="Escape"){ box.style.display="none"; } });
}
function render(){
  var r=parse(), html="";

    if(["partner","dash","o","help"].indexOf(r.name)===-1){ try{ location.hash="#dash"; }catch(e){} r={name:"dash",id:""}; }
  } else if(MODE==="host"){
    if(["host","o","help","s"].indexOf(r.name)===-1){ try{ location.hash="#host"; }catch(e){} r={name:"host",id:""}; }
  }
  try{
  switch(r.name){
    case "home": html=vHome(); break;
    case "products": html=vList(); break;

    case "s": html=vShop(r.id); break;

    case "favs": html=vFavs(); break;
    case "host": html=vHost(); break;

    case "o": html=vInvoice(r.id); break;
    case "bill": html=vBill(r.id); break;
    case "track": html=vTrack(r.id); break;
    case "account": html=vAccount(); break;
    case "login": html=vLogin(); break;

      '<ul style="display:grid;gap:.4rem;font-size:.88rem"><li>• '+esc(t("Login"))+' — '+esc(t("Mobile number"))+' / '+esc(t("Email"))+' / Google ('+esc(t("Demo mode"))+')</li>'+

    default: html=vHome();

  var key=r.name+"/"+r.id, y=window.pageYOffset||document.documentElement.scrollTop||0;
  var same=(lastKey===key);

    if(!pv){ pv=document.createElement("div"); pv.id="pvbar"; pv.className="pvbar"; document.body.appendChild(pv); }
    pv.innerHTML='<span>'+(DB.lang==="hi"?"प्रीव्यू: ":"Preview: ")+(MODE==="customer"?(DB.lang==="hi"?"ग्राहक वाली साइट":"customer site"):(DB.lang==="hi"?"दुकानदार वाली साइट":"shopkeeper site"))+'</span>'+
      '<button class="btn btn-sm btn-primary" onclick="A.previewBack()">'+(DB.lang==="hi"?"वापस होस्ट पैनल":"Back to host panel")+'</button>';
